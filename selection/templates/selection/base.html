<!DOCTYPE html>
<html>
<head>
    <title>Smart Board System</title>
    {% load static %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body { background: #f4f6f9; font-family: 'Inter', sans-serif; }
        .navbar {
            background: linear-gradient(120deg, #101b3d, #1f3b73);
            box-shadow: 0 6px 20px rgba(16, 27, 61, 0.25);
            padding-top: .75rem; padding-bottom: .75rem;
        }
        .navbar-brand { font-family: 'Baloo 2', sans-serif; font-size: 1.4rem; }
        .navbar-nav .btn { border-radius: 999px; font-weight: 600; }
        .card { border-radius: 16px; }
        .btn { border-radius: 10px; }
        .page-title { font-weight: 800; color: #1f2937; }
        .stat-card { transition: 0.2s; }
        .stat-card:hover { transform: translateY(-4px); }
        .table thead { background: #2563eb; color: white; }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-mortarboard-fill"></i> Smart Board System</a>

        <div class="navbar-nav ms-auto gap-2">
            <a class="btn btn-light btn-sm" href="/">Dashboard</a>
            <a class="btn btn-light btn-sm" href="/board/">Board Selection</a>
            <a class="btn btn-light btn-sm" href="/selection-history/">History</a>
            <a class="btn btn-light btn-sm" href="/progress-report/">Progress</a>
            <a class="btn btn-light btn-sm" href="/reports/">Reports</a>
            <a class="btn btn-warning btn-sm" href="/admin/">Admin</a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
