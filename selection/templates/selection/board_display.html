<!DOCTYPE html>
<html>
<head>
    <title>Smart Board</title>
    {% load static %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'selection/board.css' %}" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #101b3d, #1f3b73);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .board-wrap { width: 100%; max-width: 640px; padding: 1.5rem; }
        .reveal-sub { color: #6b7280; margin-bottom: .5rem; }
        .board-ready {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 3rem 1.5rem;
            text-align: center;
        }
        .board-ready p { color: #6b7280; font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; }
        @media (min-width: 1400px) {
            .board-wrap { max-width: 760px; }
        }
    </style>
</head>
<body>

<div class="board-wrap">
    {% csrf_token %}

    <div id="boardIdle" class="board-idle">
        <i class="bi bi-easel2"></i>
        <p id="boardIdleText">Waiting for the teacher to start a class&hellip;</p>
    </div>

    <div id="boardReady" class="board-ready" style="display:none;">
        <p><i class="bi bi-check2-circle"></i> Ready for the next student</p>
        <button type="button" id="callBtn" class="btn btn-call px-5"><i class="bi bi-magic"></i> Call next student</button>
    </div>

    <div id="boardCard" class="card reveal-card" style="display:none;">
        <div class="reveal-eyebrow"><i class="bi bi-check-circle-fill"></i> Called to the board</div>

        <div class="avatar-ring"></div>

        <div class="reveal-name" data-final-name=""></div>
        <p class="reveal-sub"></p>

        <p class="welcome-line"><i class="bi bi-hand-thumbs-up-fill"></i> Welcome to the board!</p>

        <div id="activeControls" style="display:none;">
            <div id="questionPanel" class="question-panel" style="display:none;">
                <div class="question-eyebrow"><i class="bi bi-question-circle-fill"></i> Question</div>
                <p class="question-text" id="questionText"></p>
                <img id="questionImage" class="question-image" style="display:none;">
                <div id="questionChoices" class="d-flex flex-wrap gap-2 justify-content-center my-2"></div>
                <div id="choiceConfirmBar" class="choice-confirm-bar" style="display:none;">
                    <p class="mb-2">Submit "<span id="choiceConfirmText"></span>" as the answer?</p>
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="button" id="choiceConfirmYes" class="btn btn-solved"><i class="bi bi-check-lg"></i> Yes, submit</button>
                        <button type="button" id="choiceConfirmNo" class="btn btn-not-solved">Choose again</button>
                    </div>
                </div>
                <div id="questionNumber" class="d-flex gap-2 justify-content-center align-items-center my-2 d-none">
                    <input type="number" step="any" id="numberAnswerInput" class="form-control" style="max-width:160px;" placeholder="Student's answer">
                    <button type="button" id="numberSubmitBtn" class="btn btn-call">Check</button>
                </div>
            </div>

            <div class="d-flex flex-wrap gap-2 justify-content-center mt-2">
                <button type="button" id="skipAbsentBtn" class="btn btn-skip-reason"><i class="bi bi-person-dash"></i> Absent</button>
                <button type="button" id="skipNotReadyBtn" class="btn btn-skip-reason"><i class="bi bi-hourglass-split"></i> Not ready</button>
                <button type="button" id="skipOtherBtn" class="btn btn-skip-reason"><i class="bi bi-arrow-repeat"></i> Other</button>
            </div>
        </div>

        <div id="nextControls" class="mt-3" style="display:none;">
            <div id="answerFeedback" class="answer-feedback"></div>
            <div>
                <button type="button" id="callAgainBtn" class="btn btn-call px-5"><i class="bi bi-magic"></i> Call next student</button>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'selection/board.js' %}"></script>
<script src="{% static 'selection/board-display.js' %}"></script>

</body>
</html>
