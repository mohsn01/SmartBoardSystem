databases:
  - name: smartboardsystem-db
    plan: free

services:
  - type: web
    name: smartboardsystem
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.13.16"
      - key: DATABASE_URL
        fromDatabase:
          name: smartboardsystem-db
          property: connectionString
